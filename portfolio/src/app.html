<!doctype html>
<html lang="en"> 
	<head>
		<!-- Defines character encoding to support various languages and special characters -->
		<meta charset="utf-8" />
		<!-- Ensures the webpage is responsive on all devices by controlling the viewport scaling -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- SEO Meta Tags -->
  <meta name="author" content="David Hájek" />
  <meta name="description" content="A personal portfolio of David Hájek" />
  <meta name="keywords" content="SvelteKit, UI Design, Portfolio, Web App, Blender, 3D, David Hájek, David-Hajek, David Hajek, David Hajek Artstation, David Hajek Blender, David Hajek Portfolio, David Hájek Portfolio, David Hájek, David Hájek Art, David Hájek Artist, Portfolio, 3D Portfolio, Blender David, Mhaace" />

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="David Hajek - 3D Artist & Visual Designer" />
  <meta property="og:description" content="Transforming creative concepts into stunning digital experiences. Specializing in 3D visuals." />
  <meta property="og:image" content="%sveltekit.assets%/images/og-image.jpg" />
  <meta property="og:image:alt" content="David Hajek Portfolio Preview" />
  <meta property="og:url" content="https://yourdomain.com" />
  <meta property="og:site_name" content="David Hajek Portfolio" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="David Hajek - 3D Artist & Visual Designer" />
  <meta name="twitter:description" content="Transforming creative concepts into stunning digital experiences. Specializing in 3D visuals and compelling digital art." />
  <meta name="twitter:image" content="%sveltekit.assets%/images/og-image.jpg" />
  <meta name="twitter:image:alt" content="David Hajek Portfolio Preview" />

		<!-- Sets the website favicon dynamically using SvelteKit's assets system -->
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<!-- Links to a global CSS file for consistent styling across all pages -->
		<link rel="stylesheet" href="%sveltekit.assets%/styles/global.css" />


		<!-- Default Website Title (Can be overridden in pages) -->
		<title>David Hajek</title>

		<!-- SvelteKit Injected Head Content (Allows pages to override title) -->
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
